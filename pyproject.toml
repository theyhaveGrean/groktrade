[project]
name = "aegis"
version = "0.1.0"
description = "Quant research foundation: Massive bars, deterministic risk, strategy plug-ins, an XGBoost ranker, and Alpaca paper execution."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "nautilus_trader==1.231.0",
    "polars>=1.0",
    "duckdb>=1.1",
    "pyarrow>=16",
    "httpx>=0.27",
    "pydantic>=2",
    "pydantic-settings>=2",
    "typer>=0.12",
    "pyyaml>=6",
    "exchange-calendars>=4.5",
    "pandas>=2.2",
    "alpaca-py>=0.42,<1",
    "numpy>=1.26",
    "xgboost>=2.0",
    "mlflow>=2.14",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
aegis = "aegis.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aegis = ["data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore:Timestamp.utcnow is deprecated:pandas.errors.Pandas4Warning",
    "ignore:Series.values returning an ndarray:pandas.errors.Pandas4Warning",
]
