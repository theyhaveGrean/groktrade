# Starter universe for the Massive free tier.
#
# Twenty liquid U.S. names keeps a full ~2-year, 1-minute backfill near one
# hour at 5 requests/minute. This list is today's survivors, not a historical
# index. Point-in-time selection uses start/end. Add delisted names here with
# an end date when a reliable source is wired; select_as_of drops them after
# that date. Do not delete them.
#
# Example (commented, not an active member):
# - symbol: LEH
#   name: Lehman Brothers
#   listing_mic: XNYS
#   start: 2000-01-01
#   end: 2008-09-15

universe:
